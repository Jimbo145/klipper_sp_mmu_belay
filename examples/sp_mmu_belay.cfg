[sp_mmu_belay turtleneck]
manual_stepper: sp_motor
extruder: extruder
# tight_pin: ^!REPLACE_WITH_TIGHT_SWITCH_PIN
slack_pin: ^!REPLACE_WITH_SLACK_SWITCH_PIN
multiplier_high: 1.05
multiplier_low: 0.95

[gcode_macro SP_BELAY_START]
gcode:
    {% set sp = printer['gcode_macro _SP_VARS'] %}
    {% set rt = printer['gcode_macro _SP_VARS_RUNTIME'] %}
    {% set vars = printer.save_variables.variables %}
    {% set lane = vars.last_loaded_lane|default(-1)|int %}
    {% if not sp.enabled or not rt.fused or rt.exit_code|int != 0 %}
        {action_raise_error('SP belay: SP MMU is disabled, not initialized for printing, or has an error')}
    {% elif vars.hotend_loaded|default(0)|int != 1 or lane < 0 or lane >= sp.lanes %}
        {action_raise_error('SP belay: no valid loaded lane')}
    {% elif sp.has_guest_lane and lane == sp.lanes - 1 %}
        {action_raise_error('SP belay: guest lane is not supported')}
    {% else %}
        M400
        _SP_LANE_SELECT LANE={lane}
        SP_BELAY_ENABLE BELAY=turtleneck
    {% endif %}

[gcode_macro SP_BELAY_STOP]
gcode:
    M400
    SP_BELAY_DISABLE BELAY=turtleneck
    SP_HOME